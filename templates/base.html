<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}نظام الحضور الذكي{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <span class="logo">👤</span>
            <span>نظام الحضور الذكي</span>
        </div>
        <ul class="nav-links">
            <li><a href="/" class="{% if request.path == '/' %}active{% endif %}">🏠 الرئيسية</a></li>
            <li><a href="/register" class="{% if request.path == '/register' %}active{% endif %}">➕ تسجيل شخص</a></li>
            <li><a href="/attendance" class="{% if request.path == '/attendance' %}active{% endif %}">📷 الحضور</a></li>
            <li><a href="/logs" class="{% if request.path == '/logs' %}active{% endif %}">📋 السجلات</a></li>
        </ul>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>نظام الحضور الذكي بالتعرف على الوجوه © 2026</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
